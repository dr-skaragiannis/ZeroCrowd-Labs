[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:http80]
command=python /tmp/server/80/80.py
directory=/tmp/server/80
priority=10
autorestart=true
startsecs=2

[program:http31337]
command=python /tmp/server/31337/31337.py
directory=/tmp/server/31337
priority=10
autorestart=true
startsecs=2

[program:ssh]
command=/usr/sbin/sshd -D
priority=20
autorestart=true
startsecs=2
