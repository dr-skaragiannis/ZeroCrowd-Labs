[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:ssh]
command=/usr/sbin/sshd -D
autorestart=true
startsecs=2

[program:tomcat]
command=/usr/local/tomcat/bin/catalina.sh run
user=ta
environment=JAVA_HOME="/usr/lib/jvm/jdk1.8.0_171",PATH="/usr/lib/jvm/jdk1.8.0_171/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autorestart=true
startsecs=8

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
startsecs=2
