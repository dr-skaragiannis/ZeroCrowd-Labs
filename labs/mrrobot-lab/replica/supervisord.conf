[supervisord]
nodaemon=true
user=root

[program:mysql]
command=/opt/bitnami/mysql/bin/mysqld --user=mysql
autorestart=true
priority=10
startsecs=8

[program:php]
command=/opt/bitnami/php/sbin/php-fpm --nodaemonize --pid /opt/bitnami/php/var/run/php5-fpm.pid --fpm-config /opt/bitnami/php/etc/php-fpm.conf --prefix /opt/bitnami/php -c /opt/bitnami/php/etc/php.ini
autorestart=true
priority=20
startsecs=3

[program:web]
command=/bin/sh -c ". /opt/bitnami/apache2/bin/envvars && exec /opt/bitnami/apache2/bin/httpd -f /opt/bitnami/apache2/conf/httpd.conf -D FOREGROUND"
autorestart=true
priority=30
startsecs=3

[program:ssh]
command=/usr/sbin/sshd -D
autorestart=true
priority=40

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
priority=50
