[supervisord]
nodaemon=true
user=root

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true

[program:snmpd]
command=/usr/sbin/snmpd -f -Lo -u root -I -ipv6 -I -smux
autorestart=true

[program:cron]
command=/usr/sbin/cron -f
autorestart=true

[program:udp666]
command=/usr/local/bin/python /root/scripts/listenu666.py
autorestart=true
