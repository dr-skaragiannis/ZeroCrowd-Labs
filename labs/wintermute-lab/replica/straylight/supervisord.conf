[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:apache]
command=/usr/sbin/apachectl -D FOREGROUND
autorestart=true
startsecs=2

[program:mariadb]
command=/usr/sbin/mysqld --user=mysql --bind-address=127.0.0.1
autorestart=true
startsecs=3

[program:redis]
command=/usr/bin/redis-server --daemonize no --bind 127.0.0.1 --port 6379 --protected-mode yes
autorestart=true
startsecs=2

[program:snmpd]
command=/usr/sbin/snmpd -f -Lo -I -smux
autorestart=true
startsecs=2

[program:postfix]
command=/bin/sh -c "/usr/sbin/postfix start && exec sleep infinity"
autorestart=true
startsecs=2

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
startsecs=2

[program:ntopng]
command=/usr/local/bin/ntopng /etc/ntopng/ntopng.conf
autorestart=true
startsecs=3

[program:bolo]
command=/bin/sh /root/scripts/loop.sh
autorestart=true
startsecs=1

[program:freeside]
command=/bin/sh /root/scripts/frun.sh
autorestart=true
startsecs=1
