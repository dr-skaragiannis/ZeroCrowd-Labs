[program:mysqld]
command=/usr/sbin/mysqld --user=mysql --datadir=/var/lib/mysql
autorestart=true
priority=10
stdout_logfile=/var/log/mysql-supervisor.log
stderr_logfile=/var/log/mysql-supervisor.err

[program:sshd]
command=/usr/sbin/sshd -D
autorestart=true
priority=20

[program:sendmail]
command=/usr/sbin/sendmail -bD -q15m
autorestart=true
priority=20
startsecs=5

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
priority=20

[program:rpcbind]
command=/sbin/rpcbind -f
autorestart=true
priority=15

[program:rpcstatd]
command=/sbin/rpc.statd -F
autorestart=true
priority=18

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
autorestart=true
priority=30
