[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:rpyc]
command=/usr/bin/python3 /usr/local/bin/rpyc_classic.py
priority=10
autorestart=true
startsecs=2

[program:apache]
command=/usr/sbin/apache2ctl -D FOREGROUND
priority=20
autorestart=true
startsecs=2

[program:ssh]
command=/usr/sbin/sshd -D
priority=20
autorestart=true
startsecs=2

[program:cron]
command=/usr/sbin/cron -f
priority=30
autorestart=true
startsecs=2
